<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
      :root { color-scheme: light; background: #f9f9f9; }
      body, #app { margin: 0; min-height: 100vh; background: #f9f9f9; }
      :root.dark { color-scheme: dark; background: #181818; }
      :root.dark body, :root.dark #app { background: #181818; }
    </style>
    <script>
      (() => {
        const savedColorMode = localStorage.getItem('portfolio-color-mode')
        const mode = savedColorMode === 'light' || savedColorMode === 'dark'
          ? savedColorMode
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'

        document.documentElement.classList.toggle('dark', mode === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
